<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14594b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المدرسة القرآنية">
<title>متابعة طلاب المدرسة القرآنية</title>
<style>
@font-face {  font-family: 'Amiri';  font-style: normal;  font-display: swap;  font-weight: 400;  src:url(fonts/amiri-arabic-400-normal.woff2) format('woff2');}
@font-face {  font-family: 'Amiri';  font-style: normal;  font-display: swap;  font-weight: 400;  src:url(fonts/amiri-latin-400-normal.woff2) format('woff2');}
@font-face {  font-family: 'Amiri';  font-style: normal;  font-display: swap;  font-weight: 700;  src:url(fonts/amiri-arabic-700-normal.woff2) format('woff2');}
@font-face {  font-family: 'Amiri';  font-style: normal;  font-display: swap;  font-weight: 700;  src:url(fonts/amiri-latin-700-normal.woff2) format('woff2');}
@font-face {  font-family: 'Cairo';  font-style: normal;  font-display: swap;  font-weight: 400;  src:url(fonts/cairo-arabic-400-normal.woff2) format('woff2');}
@font-face {  font-family: 'Cairo';  font-style: normal;  font-display: swap;  font-weight: 400;  src:url(fonts/cairo-latin-400-normal.woff2) format('woff2');}
@font-face {  font-family: 'Cairo';  font-style: normal;  font-display: swap;  font-weight: 600;  src:url(fonts/cairo-arabic-600-normal.woff2) format('woff2');}
@font-face {  font-family: 'Cairo';  font-style: normal;  font-display: swap;  font-weight: 600;  src:url(fonts/cairo-latin-600-normal.woff2) format('woff2');}
@font-face {  font-family: 'Cairo';  font-style: normal;  font-display: swap;  font-weight: 700;  src:url(fonts/cairo-arabic-700-normal.woff2) format('woff2');}
@font-face {  font-family: 'Cairo';  font-style: normal;  font-display: swap;  font-weight: 700;  src:url(fonts/cairo-latin-700-normal.woff2) format('woff2');}
:root{--bg:#f3f6f2;--card:#fff;--ink:#16302b;--mut:#5f7771;--line:#d5e0db;--pri:#14594b;--pri2:#0e4136;--gold:#b58a2b;--bad:#a63d3d;--soft:#e4efe9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#16241f;--ink:#e6efeb;--mut:#93aaa3;--line:#2a3d37;--pri:#4fb59f;--pri2:#3a9985;--gold:#d4aa4a;--bad:#e07c7c;--soft:#1d302a}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#16241f;--ink:#e6efeb;--mut:#93aaa3;--line:#2a3d37;--pri:#4fb59f;--pri2:#3a9985;--gold:#d4aa4a;--bad:#e07c7c;--soft:#1d302a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
header{padding:20px 16px 8px;max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:Amiri,'Traditional Arabic',serif;font-size:30px;margin:0;color:var(--pri)}
nav{max-width:980px;margin:auto;padding:0 16px;display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px Cairo,Tahoma;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--gold)}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat b{display:block;font:700 28px Amiri,serif;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:600 14px Cairo,Tahoma;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#06201a}
.btn.alt{background:var(--soft);color:var(--pri)}.btn.del{background:none;color:var(--bad);border:1px solid var(--line)}
.list{display:grid;gap:8px}
.st{display:grid;grid-template-columns:1fr auto;gap:6px 10px;cursor:pointer;align-items:center}
.st:hover{border-color:var(--pri)}
.name{font-weight:700}.sub{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--pri)}
.tag{font-size:12px;padding:1px 9px;border-radius:12px;background:var(--soft);color:var(--pri)}
.tag.f{background:#f3e3ea;color:#8a3b5c}.tag.m{background:#dfeaf5;color:#2c5a85}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.f{background:#3a2430;color:#e4a3bf}:root:not([data-theme="light"]) .tag.m{background:#1f3041;color:#9cc3e8}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:18px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}label input,label select,label textarea{display:block;width:100%;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}.empty{color:var(--mut);text-align:center;padding:24px}
.ayat{font-family:Amiri,serif;font-size:18px;color:var(--gold)}
.s-p{--c:#1f8a4c}.s-l{--c:#e07b1a}.s-a{--c:#cc3b33}.s-e{--c:#6b7f8f}
.pill{display:inline-block;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;background:var(--c)}
.btn.s-p,.btn.s-l,.btn.s-a{background:var(--c);color:#fff!important}.btn.sm{padding:3px 10px;font-size:12px}
select.sel{border:2px solid var(--line)}select.sel[class*="s-"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));font-weight:600}
.fl input,.fl select{width:100%;font-size:13px;padding:5px;min-width:90px}.fl td{background:var(--soft)}
</style>
</head>
<body>
<header><h1>متابعة طلاب المدرسة القرآنية</h1>
<div class="row" style="margin:0"><button class="btn" id="inst" hidden>تثبيت التطبيق</button><button class="btn alt" id="exp">نسخ احتياطي</button><button class="btn alt" id="imp">استرجاع</button><input type="file" id="file" accept=".json" hidden></div></header>
<nav id="nav"><button data-t="dash" class="on">الرئيسية</button><button data-t="stu">الطلاب</button><button data-t="rec">التسميع</button><button data-t="att">الحضور</button></nav>
<main id="main"></main>

<dialog id="dlgS"><form method="dialog" id="fS"><h3 id="dsT" style="margin-top:0"></h3>
<label>الاسم الكامل<input name="name" required></label>
<div class="two"><label>الجنس<select name="gender"><option value="m">ذكر</option><option value="f">أنثى</option></select></label>
<label>تاريخ الميلاد<input type="date" name="birth"></label></div>
<div class="two"><label>الحلقة / المستوى<input name="group" placeholder="مثال: حلقة الفجر"></label>
<label>هاتف ولي الأمر<input name="phone" inputmode="tel"></label></div>
<label>ملاحظات<textarea name="notes" rows="2"></textarea></label>
<div class="row"><button class="btn" value="ok">حفظ</button><button class="btn alt" value="x" formnovalidate>إلغاء</button></div></form></dialog>

<dialog id="dlgD"><div id="detail"></div></dialog>

<script>
const AY=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const SN="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const TOTAL=6236,KEY="quran_school_v1";
let D={students:[],records:[],att:{}},tab="dash",editId=null,q="",gf="";
try{const s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gtag=g=>g==="f"?'<span class="tag f">طالبة</span>':'<span class="tag m">طالب</span>';
function memo(id){ // union of memorized ranges per surah
  const m={};D.records.filter(r=>r.sid===id&&r.type==="hifz").forEach(r=>{(m[r.surah]=m[r.surah]||[]).push([r.from,r.to])});
  let tot=0,per={};for(const k in m){const a=m[k].sort((x,y)=>x[0]-y[0]);let c=0,s=a[0][0],e=a[0][1];for(let i=1;i<a.length;i++){if(a[i][0]<=e+1)e=Math.max(e,a[i][1]);else{c+=e-s+1;s=a[i][0];e=a[i][1]}}c+=e-s+1;per[k]=c;tot+=c}
  return{tot,per}}
function last(id){const r=D.records.filter(r=>r.sid===id&&r.type==="hifz").sort((a,b)=>b.date.localeCompare(a.date))[0];return r?`${SN[r.surah]} آية ${r.to}`:"لم يبدأ بعد"}
const pct=n=>(n/TOTAL*100).toFixed(1);
const sname=id=>(D.students.find(s=>s.id===id)||{name:"(محذوف)"}).name;

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  $("#main").innerHTML=({dash,stu,rec,att})[tab]();bind()}

function attLine(id){const ym=today().slice(0,7),r={p:0,l:0,a:0,e:0};for(const k in D.att)if(k.startsWith(ym)&&D.att[k][id])r[D.att[k][id]]++;
  if(!(r.p+r.l+r.a+r.e))return'<span class="sub">لا حضور مسجّل هذا الشهر</span>';
  return`<span class="sub">حضور الشهر:</span> <span class="pill s-p">${r.p} حاضر</span> <span class="pill s-l">${r.l} متأخر</span> <span class="pill s-a">${r.a} غائب</span>${r.e?` <span class="pill s-e">${r.e} بعذر</span>`:""}`}
function dash(){
  const n=D.students.length,f=D.students.filter(s=>s.gender==="f").length;
  const rank=D.students.map(s=>({s,t:memo(s.id).tot})).sort((a,b)=>b.t-a.t).slice(0,5);
  const wk=Date.now()-7*864e5,wr=D.records.filter(r=>new Date(r.date)>=wk).length;
  const pr=Object.keys(D.att[today()]||{}).filter(k=>D.att[today()][k]==="p").length;
  return`<div class="grid"><div class="card stat"><b>${n}</b><span>إجمالي الطلاب</span></div><div class="card stat"><b>${n-f}</b><span>طلاب</span></div><div class="card stat"><b>${f}</b><span>طالبات</span></div><div class="card stat"><b>${wr}</b><span>تسميعات هذا الأسبوع</span></div><div class="card stat"><b>${pr}</b><span>حاضرون اليوم</span></div></div>
  <div class="card"><h3 style="margin-top:0">الأكثر حفظًا</h3>${rank.length&&rank[0].t?rank.filter(x=>x.t).map(x=>`<div class="st" style="margin-bottom:10px"><div><span class="name">${esc(x.s.name)}</span> ${gtag(x.s.gender)}<div class="sub">${x.t} آية · ${pct(x.t)}٪ من المصحف</div></div><div class="bar"><i style="width:${pct(x.t)}%"></i></div></div>`).join(""):'<div class="empty">سجّل أول تسميع من تبويب «التسميع» ليظهر الترتيب هنا.</div>'}</div>`}

function stu(){
  const L=D.students.filter(s=>s.name.includes(q)&&(!gf||s.gender===gf));
  return`<div class="row"><input id="q" placeholder="بحث بالاسم" value="${esc(q)}" style="flex:1"><select id="gf"><option value="">الكل</option><option value="m"${gf==="m"?" selected":""}>الطلاب</option><option value="f"${gf==="f"?" selected":""}>الطالبات</option></select><button class="btn" id="add">إضافة طالب</button></div>
  <div class="list">${L.length?L.map(s=>{const t=memo(s.id).tot;return`<div class="card st" data-id="${s.id}"><div><span class="name">${esc(s.name)}</span> ${gtag(s.gender)} ${s.group?`<span class="tag">${esc(s.group)}</span>`:""}<div class="sub">آخر موضع: ${last(s.id)} · ${t} آية (${pct(t)}٪)</div><div style="margin-top:4px">${attLine(s.id)}</div></div><div class="bar"><i style="width:${pct(t)}%"></i></div></div>`}).join(""):'<div class="empty">لا يوجد طلاب بعد. اضغط «إضافة طالب» لتسجيل أول طالب.</div>'}</div>`}

function rec(){
  if(!D.students.length)return'<div class="empty">أضف طلابًا أولًا من تبويب «الطلاب».</div>';
  const so=D.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(""),su=SN.map((n,i)=>`<option value="${i}">${i+1}. ${n}</option>`).join("");
  const F=window._rf||(window._rf={d:"",s:"",t:"",u:"",g:""}),E=D.records.find(r=>r.id===window._er),gs=["ممتاز","جيد جدًا","جيد","مقبول","يعيد"];
  const all=[...D.records].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).filter(r=>(!F.d||r.date===F.d)&&(!F.s||sname(r.sid).includes(F.s))&&(!F.t||r.type===F.t)&&(!F.u||String(r.surah)===F.u)&&(!F.g||r.grade===F.g)),R=all.slice(0,100);
  const sf=SN.map((n,i)=>`<option value="${i}"${F.u===String(i)?" selected":""}>${n}</option>`).join("");
  return`<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">${E?"تعديل تسميع":"تسجيل تسميع"}</h3>${E?`<div class="sub" style="margin-bottom:8px">تعديل تسميع: ${esc(sname(E.sid))} — ${E.date}</div>`:""}
  <label>بحث عن طالب<input type="search" id="rq" placeholder="اكتب جزءًا من الاسم" autocomplete="off"></label>
  <div class="two"><label>الطالب<select id="rs">${so}</select></label><label>التاريخ<input type="date" id="rd" value="${today()}"></label></div>
  <div class="two"><label>النوع<select id="rt"><option value="hifz">حفظ جديد</option><option value="rev">مراجعة</option></select></label><label>التقدير<select id="rg">${gs.map(g=>`<option>${g}</option>`).join("")}</select></label></div>
  <div class="two"><label>السورة<select id="ru">${su}</select></label><div class="two"><label>من آية<input type="number" id="rf" min="1" value="1"></label><label>إلى آية<input type="number" id="re" min="1" value="1"></label></div></div>
  <div class="row"><button class="btn" id="rsave">${E?"تحديث التسميع":"حفظ التسميع"}</button>${E?'<button class="btn alt" id="rcan">إلغاء التعديل</button>':""}<span class="sub" id="rmsg"></span></div></div>
  <div class="card scroll"><h3 style="margin-top:0">التسميعات (${all.length})</h3><table><tr><th>التاريخ</th><th>الطالب</th><th>النوع</th><th>الموضع</th><th>التقدير</th><th></th></tr>
  <tr class="fl"><td><input type="date" id="fd" value="${F.d}"></td><td><input id="fs" placeholder="اسم الطالب" value="${esc(F.s)}"></td>
  <td><select id="ft"><option value="">الكل</option><option value="hifz"${F.t==="hifz"?" selected":""}>حفظ</option><option value="rev"${F.t==="rev"?" selected":""}>مراجعة</option></select></td>
  <td><select id="fu"><option value="">الكل</option>${sf}</select></td>
  <td><select id="fg"><option value="">الكل</option>${gs.map(g=>`<option${F.g===g?" selected":""}>${g}</option>`).join("")}</select></td><td><button class="btn alt sm" id="fc">مسح</button></td></tr>
  ${R.length?R.map(r=>`<tr><td>${r.date}</td><td>${esc(sname(r.sid))}</td><td>${r.type==="hifz"?"حفظ":"مراجعة"}</td><td>${SN[r.surah]} ${r.from}–${r.to}</td><td>${r.grade}</td><td style="white-space:nowrap"><button class="btn alt sm" data-e="${r.id}">تعديل</button> <button class="btn del sm" data-x="${r.id}">حذف</button></td></tr>`).join(""):'<tr><td colspan="6" class="empty">لا توجد تسميعات مطابقة.</td></tr>'}</table>${all.length>100?'<div class="sub">يُعرض أحدث 100 تسميع، استخدم الفلاتر للتضييق.</div>':""}</div>`}

function att(){
  if(!D.students.length)return'<div class="empty">أضف طلابًا أولًا من تبويب «الطلاب».</div>';
  const d=window._ad||today(),A=D.att[d]||{},S=window._sel||(window._sel={}),n=D.students.length,c={p:0,l:0,a:0,e:0};
  D.students.forEach(s=>{if(A[s.id])c[A[s.id]]++});
  const un=n-c.p-c.l-c.a-c.e,ym=d.slice(0,7);let pp=0,tt=0;
  for(const k in D.att)if(k.startsWith(ym))D.students.forEach(s=>{const v=D.att[k][s.id];if(v){tt++;if(v==="p"||v==="l")pp++}});
  const rate=tt?Math.round(pp/tt*100):0,ns=D.students.filter(s=>S[s.id]).length;
  const box=(k,t,v)=>`<div class="card stat s-${k}" style="border-top:4px solid var(--c)"><b style="color:var(--c)">${v}</b><span>${t}</span></div>`;
  const opts=v=>[["","لم يُسجَّل"],["p","حاضر"],["l","متأخر"],["e","غائب بعذر"],["a","غائب"]].map(([k,t])=>`<option value="${k}"${k===v?" selected":""}>${t}</option>`).join("");
  const ck='style="width:20px;height:20px;margin:0;display:inline-block"',lb='style="display:flex;align-items:center;gap:10px;margin:0;color:var(--ink);font-size:15px;cursor:pointer"';
  return`<div class="row"><label style="margin:0">التاريخ <input type="date" id="ad" value="${d}" style="display:inline-block;width:auto"></label></div>
  <div class="grid">${box("p","حاضر",c.p)}${box("l","متأخر",c.l)}${box("a","غائب",c.a)}${box("e","غائب بعذر",c.e)}<div class="card stat"><b>${un}</b><span>لم يُسجَّل بعد</span></div><div class="card stat"><b>${rate}٪</b><span>نسبة الحضور هذا الشهر${tt?" ("+pp+" من "+tt+")":""}</span></div></div>
  <div class="card" style="margin-bottom:10px"><div class="row" style="margin:0"><label ${lb}><input type="checkbox" id="sa" ${ns===n?"checked":""} ${ck}>تحديد الكل</label><span class="sub">المحدد: ${ns}</span><span style="flex:1"></span><button class="btn s-p" data-bulk="p">تسجيل حاضر</button><button class="btn s-l" data-bulk="l">متأخر</button><button class="btn s-a" data-bulk="a">غائب</button></div></div>
  <div class="list">${D.students.map(s=>{const v=A[s.id]||"";return`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><label ${lb}><input type="checkbox" data-c="${s.id}" ${S[s.id]?"checked":""} ${ck}><span class="name">${esc(s.name)}</span> ${gtag(s.gender)}</label><select class="sel${v?" s-"+v:""}" data-a="${s.id}">${opts(v)}</select></div>`}).join("")}</div>`}

function bind(){
  const keep=id=>{const el=$(id),p=el.selectionStart;render();const n=$(id);n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  if(tab==="stu"){$("#q").oninput=e=>{q=e.target.value;keep("#q")};$("#gf").onchange=e=>{gf=e.target.value;render()};$("#add").onclick=()=>openS();
    document.querySelectorAll(".st[data-id]").forEach(c=>c.onclick=()=>openD(c.dataset.id))}
  if(tab==="rec"&&$("#rsave")){
    const E=D.records.find(r=>r.id===window._er),F=window._rf,sync=()=>{$("#re").max=$("#rf").max=AY[$("#ru").value]};
    $("#ru").onchange=sync;
    if(E){$("#rs").value=E.sid;$("#rd").value=E.date;$("#rt").value=E.type;$("#rg").value=E.grade;$("#ru").value=E.surah;$("#rf").value=E.from;$("#re").value=E.to}
    sync();
    $("#rq").oninput=e=>{const v=e.target.value.trim(),L=D.students.filter(s=>s.name.includes(v));$("#rs").innerHTML=L.length?L.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(""):'<option value="">لا توجد نتائج</option>'};
    $("#rsave").onclick=()=>{const su=+$("#ru").value,f=+$("#rf").value,e=+$("#re").value,m=AY[su];
      if(!$("#rs").value){$("#rmsg").textContent="اختر طالبًا أولًا.";return}
      if(!(f>=1&&e>=f&&e<=m)){$("#rmsg").textContent=`تحقّق من الآيات: سورة ${SN[su]} فيها ${m} آية.`;return}
      const o={sid:$("#rs").value,date:$("#rd").value||today(),type:$("#rt").value,grade:$("#rg").value,surah:su,from:f,to:e};
      if(E)Object.assign(E,o);else D.records.push({id:uid(),...o});
      window._er=null;save();render();$("#rmsg").textContent=E?"تم تحديث التسميع.":"تم حفظ التسميع."};
    if($("#rcan"))$("#rcan").onclick=()=>{window._er=null;render()};
    $("#fd").onchange=e=>{F.d=e.target.value;render()};
    $("#fs").oninput=e=>{F.s=e.target.value.trim();keep("#fs")};
    $("#ft").onchange=e=>{F.t=e.target.value;render()};$("#fu").onchange=e=>{F.u=e.target.value;render()};$("#fg").onchange=e=>{F.g=e.target.value;render()};
    $("#fc").onclick=()=>{window._rf={d:"",s:"",t:"",u:"",g:""};render()};
    document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{window._er=b.dataset.e;render();window.scrollTo({top:0,behavior:"smooth"})});
    document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("حذف هذا التسميع؟")){D.records=D.records.filter(r=>r.id!==b.dataset.x);if(window._er===b.dataset.x)window._er=null;save();render()}})}
  if(tab==="att"&&$("#ad")){
    $("#ad").onchange=e=>{window._ad=e.target.value;window._sel={};render()};
    $("#sa").onchange=e=>{window._sel={};if(e.target.checked)D.students.forEach(s=>window._sel[s.id]=1);render()};
    document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{if(c.checked)window._sel[c.dataset.c]=1;else delete window._sel[c.dataset.c];render()});
    document.querySelectorAll("[data-bulk]").forEach(b=>b.onclick=()=>{const ids=D.students.filter(s=>window._sel[s.id]).map(s=>s.id);if(!ids.length){alert("حدّد طالبًا واحدًا على الأقل.");return}
      const d=window._ad||today();D.att[d]=D.att[d]||{};ids.forEach(i=>D.att[d][i]=b.dataset.bulk);window._sel={};save();render()});
    document.querySelectorAll("[data-a]").forEach(x=>x.onchange=()=>{const d=window._ad||today();D.att[d]=D.att[d]||{};if(x.value)D.att[d][x.dataset.a]=x.value;else delete D.att[d][x.dataset.a];save();render()})}}

function openS(id){editId=id||null;const f=$("#fS"),s=D.students.find(x=>x.id===id)||{};$("#dsT").textContent=id?"تعديل بيانات الطالب":"إضافة طالب";
  ["name","gender","birth","group","phone","notes"].forEach(k=>f.elements[k].value=s[k]||(k==="gender"?"m":""));$("#dlgS").showModal()}
$("#fS").addEventListener("submit",e=>{if(e.submitter.value!=="ok")return;const f=e.target,o={};["name","gender","birth","group","phone","notes"].forEach(k=>o[k]=f.elements[k].value.trim());
  if(editId)Object.assign(D.students.find(x=>x.id===editId),o);else D.students.push({id:uid(),joined:today(),...o});save();render();if(editId&&$("#dlgD").open)openD(editId)});

function openD(id){const s=D.students.find(x=>x.id===id);if(!s)return;const m=memo(id),H=D.records.filter(r=>r.sid===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  const per=Object.keys(m.per).sort((a,b)=>a-b).map(k=>`<tr><td>${SN[k]}</td><td>${m.per[k]} / ${AY[k]}</td><td style="width:40%"><div class="bar"><i style="width:${m.per[k]/AY[k]*100}%"></i></div></td></tr>`).join("");
  const ab=Object.values(D.att).filter(a=>a[id]==="a").length,pr=Object.values(D.att).filter(a=>a[id]==="p"||a[id]==="l").length;
  $("#detail").innerHTML=`<h3 style="margin-top:0">${esc(s.name)} ${gtag(s.gender)}</h3>
  <div class="sub">${[s.group,s.birth&&"مواليد "+s.birth,s.phone&&"ولي الأمر: "+esc(s.phone)].filter(Boolean).join(" · ")}</div>${s.notes?`<p>${esc(s.notes)}</p>`:""}
  <div class="grid" style="margin-top:12px"><div class="card stat"><b>${m.tot}</b><span>آية محفوظة (${pct(m.tot)}٪)</span></div><div class="card stat"><b>${pr}</b><span>أيام الحضور</span></div><div class="card stat"><b>${ab}</b><span>أيام الغياب</span></div></div>
  <p class="ayat">آخر موضع: ${last(id)}</p>
  ${per?`<div class="scroll"><table><tr><th>السورة</th><th>المحفوظ</th><th></th></tr>${per}</table></div>`:""}
  ${H.length?`<h4>آخر التسميعات</h4><div class="scroll"><table>${H.map(r=>`<tr><td>${r.date}</td><td>${r.type==="hifz"?"حفظ":"مراجعة"}</td><td>${SN[r.surah]} ${r.from}–${r.to}</td><td>${r.grade}</td></tr>`).join("")}</table></div>`:""}
  <div class="row" style="margin-top:14px"><button class="btn" id="de">تعديل</button><button class="btn del" id="dd">حذف الطالب</button><button class="btn alt" id="dc">إغلاق</button></div>`;
  $("#dc").onclick=()=>$("#dlgD").close();$("#de").onclick=()=>openS(id);
  $("#dd").onclick=()=>{if(confirm("سيُحذف الطالب وكل تسميعاته. هل تريد المتابعة؟")){D.students=D.students.filter(x=>x.id!==id);D.records=D.records.filter(r=>r.sid!==id);save();$("#dlgD").close();render()}};
  if(!$("#dlgD").open)$("#dlgD").showModal()}

$("#nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="quran-school-"+today()+".json";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.students&&j.records){D=j;save();render()}else alert("الملف غير صالح.")}catch(x){alert("تعذّرت قراءة الملف.")}};if(e.target.files[0])r.readAsText(e.target.files[0])};
render();
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("#inst").hidden=false});
$("#inst").onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$("#inst").hidden=true};
addEventListener("appinstalled",()=>{$("#inst").hidden=true});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
